[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-lightcone"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Operating System :: POSIX",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    # The paper cache and downloader are called in-process and the package
    # promises no stable API: move the pin only with the suite passing.
    "astra-tools==0.2.17",
    # The engine is called in-process and promises no stable API: raise the
    # cap only once the suite passes against the new minor release.
    "lightcone-cli>=0.5.0rc2,<0.6",
    "jupyter-ai>=3.2.0,<3.3",
    # The packages of the Jupyter AI family this extension imports directly,
    # with the caps jupyter-ai itself uses.
    "jupyter-ai-persona-manager>=0.2.0,<0.3",
    "jupyterlab-chat>=0.25.0,<0.26",
    "jupyter-server-mcp>=0.3.0,<0.4",
    "jupyterlab-commands-toolkit>=0.2.0,<0.3",
    # Output versions are read from the project's git history in process...
    "dulwich>=1.0",
    # ...and the bytes of annexed outputs are asked of git-annex, which the
    # wheel installs beside this interpreter's scripts.
    "git-annex>=10.2026"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.entry-points."jupyter_server_mcp.tools"]
lightcone = "jupyterlab_lightcone.agent_tools:TOOLS"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.5.10,<5",
    "jupyter-builder>=1.2.0",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0",
    "jupyterhub>=5.4.5,<7",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_lightcone/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"src/vendor/MYSTRA-LICENSE" = "share/jupyter/labextensions/jupyterlab-lightcone/MYSTRA-LICENSE"
"jupyterlab_lightcone/labextension" = "share/jupyter/labextensions/jupyterlab-lightcone"
"install.json" = "share/jupyter/labextensions/jupyterlab-lightcone/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
# Jupyter AI's persona manager extension reads this config file; it selects
# the project-aware manager (agent_workspace.PersonaManager) for every chat.
"jupyter-config/persona-manager/jupyter_jupyter_ai_persona_manager_config.json" = "etc/jupyter/jupyter_jupyter_ai_persona_manager_config.json"

[tool.hatch.build.hooks.version]
path = "jupyterlab_lightcone/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_lightcone/labextension/static/style.js",
    "jupyterlab_lightcone/labextension/package.json",
]
skip-if-exists = ["jupyterlab_lightcone/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_lightcone/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
