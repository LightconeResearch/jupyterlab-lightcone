name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          python_version: '3.14'
          node_version: '22'
      - name: Create development environment
        run: python -m venv .venv
      - name: Install build dependencies
        run: |
          source .venv/bin/activate
          python -m pip install "jupyterlab==4.6.3" "jupyter-builder>=1.2.0,<2" build
          jlpm install --immutable
      - name: Check frontend
        run: |
          source .venv/bin/activate
          jlpm lint:check
          jlpm typecheck
      - name: Build distributions
        run: |
          source .venv/bin/activate
          python -m build
      - name: Check installed package
        run: |
          source .venv/bin/activate
          python -m pip install dist/*.whl pytest pytest-cov
          python -m pytest -q --cov=jupyterlab_lightcone
          python .github/scripts/check_auth.py
          jupyter labextension list
      - uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: dist/jupyterlab_lightcone*
          if-no-files-found: error

  test_isolated:
    name: Wheel without Node (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    container: python:${{ matrix.python-version }}-slim
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
      - name: Install and check without Node.js
        run: |
          python -m venv /tmp/lightcone-test
          source /tmp/lightcone-test/bin/activate
          python -c "import shutil; assert shutil.which('node') is None"
          python -m pip install "jupyterlab==4.6.3" jupyterlab_lightcone*.whl
          python -m pip check
          jupyter labextension list 2>&1 | grep -i '@lightcone-research/jupyterlab-lightcone.*OK'
          python -m jupyterlab.browser_check --no-browser-test --allow-root

  integration-tests:
    name: Installed browser smoke test
    needs: build
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          python_version: '3.14'
          node_version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
      - name: Install the wheel
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install "jupyterlab==4.6.3" jupyterlab_lightcone*.whl
      - name: Install browser test dependencies
        run: |
          source .venv/bin/activate
          cd ui-tests
          jlpm install --immutable
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}
      - name: Install browser
        run: |
          source .venv/bin/activate
          cd ui-tests
          jlpm playwright install --with-deps chromium
      - name: Execute integration tests
        run: |
          source .venv/bin/activate
          cd ui-tests
          jlpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jupyterlab_lightcone-playwright-tests
          path: |
            ui-tests/test-results
            ui-tests/playwright-report
