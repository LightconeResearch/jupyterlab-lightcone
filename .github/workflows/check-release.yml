name: Check Release
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - name: Choose a dry-run version
        id: dry-run-version
        run: |
          python - <<'PYTHON'
          import json
          import os

          version = json.load(open("package.json"))["version"]
          major, minor, patch = map(int, version.split("-")[0].split("."))
          # Hatch requires a version newer than the one recorded in source.
          version = f"{major}.{minor}.{patch + 1}-rc.{os.environ['GITHUB_RUN_ID']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PYTHON
      - name: Check Release
        uses: jupyter-server/jupyter_releaser/.github/actions/check-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Published versions come from release tags, not the source version.
          # Use a unique version only in the dry-run checkout to avoid tag collisions.
          version_spec: ${{ steps.dry-run-version.outputs.version }}

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlab_lightcone-releaser-dist-${{ github.run_number }}
          path: .jupyter_releaser_checkout/dist
