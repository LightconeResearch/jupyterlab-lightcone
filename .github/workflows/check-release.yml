name: Check Release
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - name: Check Release
        uses: jupyter-server/jupyter_releaser/.github/actions/check-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Published versions come from release tags, not the source version.
          # Use a unique version only in the dry-run checkout to avoid tag collisions.
          version_spec: 0.0.0-rc.${{ github.run_id }}

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlab_lightcone-releaser-dist-${{ github.run_number }}
          path: .jupyter_releaser_checkout/dist
