name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set the package version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          number = r"(?:0|[1-9][0-9]*)"
          pattern = rf"{number}\.{number}\.{number}(?:-(?:alpha|beta|rc)\.{number})?"
          if re.fullmatch(pattern, version) is None:
              raise SystemExit(
                  f"Unsupported release tag {tag!r}. Use MAJOR.MINOR.PATCH "
                  "with an optional v prefix and -alpha.N, -beta.N, or -rc.N suffix."
              )

          # Hatch derives the Python version from this build's package.json.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=4) + "\n")
          print(f"Building release version {version}")
          PYTHON

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          python -m pip install build twine "jupyterlab>=4.5.10,<5"
          jlpm install --immutable

      - name: Build and check Python distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/jupyterlab-lightcone/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
